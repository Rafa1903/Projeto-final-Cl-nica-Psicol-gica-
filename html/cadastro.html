
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="João Rafael">
    <link rel="shortcut icon" href="../images/logo.ico" type="image/x-icon">
    <link rel="stylesheet" href="../css/cadastro.css">
    <title>Clínica Psicológica - Cadastro</title>
</head>

<body>

    <div class="container">

        <div class="cadastro">

            <h1>Crie sua conta</h1>
            <p>Faça seu cadastro para acessar nossa clínica.</p>

            <form action="index.html">

                <label for="nome">Nome completo</label>
                <input type="text" id="nome" placeholder="Digite seu nome" required>

                <label for="cpf">CPF</label>
                <input type="text" id="cpf" placeholder="000.000.00-00" required>

                <label for="data_nascimento">Data de nascimento</label>
                <input type="date" id="data" nome="data" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Digite seu e-mail" required>

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" placeholder="(xx) xxxx-xxxx" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Crie uma senha" required>

                <label for="confirmar-senha">Confirmar senha</label>
                <input type="password" id="confirmar-senha" placeholder="Digite sua senha novamente" required>

                <button type="submit">Cadastrar</button>

            </form>

            <p class="login-link">
                Já possui uma conta?
                <a href="login.html">Faça login</a>
            </p>

        </div>

    </div>

</body>

</html>
